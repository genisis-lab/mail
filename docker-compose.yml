# Optional self-hosting. Most people should deploy to Cloudflare (`npm run setup`).
services:
  wren:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
    environment:
      # The public address people use (needed for provider webhook URLs).
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      # Set to 1 when a reverse proxy (Caddy, nginx, Traefik) sits in front.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Optional: Wren generates and stores a key in /data if this is empty.
      WREN_SECRET: ${WREN_SECRET:-}

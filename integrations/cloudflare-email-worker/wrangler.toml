name = "wren-email-router"
main = "worker.js"
compatibility_date = "2026-09-01"

# Set the inbound URL as a secret (it authorises delivery):
#   npx wrangler secret put WREN_INBOUND_URL
#
# Optional fallback if Wren is down (must be a verified Email Routing destination):
# [vars]
# FALLBACK_FORWARD = "you@example.org"

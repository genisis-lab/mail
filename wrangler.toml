# Wren on Cloudflare Workers. See docs/cloudflare.md.
name = "wren"
main = "src/worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# Variables set in the dashboard (Settings → Variables and Secrets) survive deploys.
keep_vars = true

# Your own hostname (optional). Either add it in the dashboard (Workers & Pages → wren →
# Settings → Domains & Routes → Add → Custom domain), or uncomment this line; then
# `wrangler deploy` creates the DNS record and certificate. The zone must be on this
# Cloudflare account. Without a custom domain Wren is served at wren.<you>.workers.dev.
# routes = [{ pattern = "mail.example.com", custom_domain = true }]

# Build the web app before bundling/deploying the Worker.
[build]
command = "npx vite build"
watch_dir = "src/web"

# The Gmail-style web app. /api/* goes to the Worker, everything else is static.
[assets]
directory = "./dist/web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/jmap/*", "/.well-known/jmap"]

# The whole database lives in one SQLite-backed Durable Object.
[[durable_objects.bindings]]
name = "WREN"
class_name = "WrenDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WrenDurableObject"]

# Raw messages and attachments. Create once: npx wrangler r2 bucket create wren-mail
# (Remove this block to keep everything inside the Durable Object instead.)
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "wren-mail"

# Safety net for the send queue / snoozes / retention (Durable Object alarms do the real work).
[triggers]
crons = ["*/5 * * * *"]

# Cloudflare Email Service: Wren sends through this binding, with no API key.
# Onboard your domain under Email Service → Email Sending in the dashboard.
# (In `npm run dev` sends are simulated and written to disk, not delivered.)
[[send_email]]
name = "EMAIL"

# Optional: pin the public address used in links, webhook URLs and passkeys, for example
# when Wren is reachable at more than one hostname. Without it, Wren uses the address
# each request came in on. You can also set PUBLIC_URL in the dashboard instead.
# [vars]
# PUBLIC_URL = "https://mail.example.com"

[observability]
enabled = true

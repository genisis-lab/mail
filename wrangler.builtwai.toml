# Wren for mail.builtwai.com: the same as wrangler.toml, plus the custom domain and
# its public URL. Deploy with:  npx wrangler deploy -c wrangler.builtwai.toml
# (Cloudflare → Workers & Pages → wren → Settings → Build → Deploy command).
# Keep the rest in step with wrangler.toml.
name = "wren"
main = "src/worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Serve Wren from its own hostname. `wrangler deploy` creates the DNS record and certificate.
# The zone must be on this Cloudflare account and no other Worker may hold the hostname.
routes = [{ pattern = "mail.builtwai.com", custom_domain = true }]

# Build the web app before bundling/deploying the Worker.
[build]
command = "npx vite build"
watch_dir = "src/web"

# The Gmail-style web app. /api/* goes to the Worker, everything else is static.
[assets]
directory = "./dist/web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# The whole database lives in one SQLite-backed Durable Object.
[[durable_objects.bindings]]
name = "WREN"
class_name = "WrenDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WrenDurableObject"]

# Raw messages and attachments. Create once: npx wrangler r2 bucket create wren-mail
# (Remove this block to keep everything inside the Durable Object instead.)
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "wren-mail"

# Safety net for the send queue / snoozes / retention (Durable Object alarms do the real work).
[triggers]
crons = ["*/5 * * * *"]

# Cloudflare Email Service: Wren sends through this binding, with no API key.
# Onboard your domain under Email Service → Email Sending in the dashboard.
# (In `npm run dev` sends are simulated and written to disk, not delivered.)
[[send_email]]
name = "EMAIL"

[vars]
# Set if your public hostname differs from the Worker URL (used for inbound webhook URLs).
PUBLIC_URL = "https://mail.builtwai.com"

[observability]
enabled = true
